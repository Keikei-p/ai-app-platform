name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") { throw "Tag $tag does not match VERSION=$version" }
      - name: Test before release
        run: |
          python -m compileall -q src tests
          python -m src.tools.security_selfcheck
          python -m unittest discover -s tests -v
          python -m src.tools.acceptance_test
          python -m src.tools.remote_acceptance_test
          python -m src.tools.smoke_test
      - name: Install pinned PyInstaller
        run: python -m pip install pyinstaller==6.22.3
      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean --windowed --name "AI-App-Platform" --paths . src/main.py
      - name: Package
        shell: pwsh
        run: |
          $name = "AI-App-Platform-Windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path "dist/AI-App-Platform/*" -DestinationPath $name -Force
          "ASSET=$name" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ASSET" --repo "${{ github.repository }}" --generate-notes --title "AI App Platform ${{ github.ref_name }}"
