name: Generated Windows App Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "src/core/windows_packager.py"
      - "src/core/ai_core.py"
      - "src/core/test_runner.py"
      - "src/tools/windows_package_acceptance.py"
      - ".github/workflows/windows-generated-app.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/core/windows_packager.py"
      - "src/core/ai_core.py"
      - "src/core/test_runner.py"
      - "src/tools/windows_package_acceptance.py"
      - ".github/workflows/windows-generated-app.yml"

permissions:
  contents: read

jobs:
  build-and-launch:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned packager
        run: python -m pip install "pyinstaller==6.22.3"
      - name: Build and self-test generated Windows EXE
        run: python -m src.tools.windows_package_acceptance
